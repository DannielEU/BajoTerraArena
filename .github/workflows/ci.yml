name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Build, tests and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Compile, test, coverage, Checkstyle, SpotBugs
        run: mvn -B verify
      - name: Keep the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco'

  mutation:
    name: Mutation testing (combat, ammo, effects)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: PIT with an 80 % threshold
        run: mvn -B -Pmutation verify -DskipTests=false
      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit
          path: bajoterra-core/target/pit-reports

  performance:
    # The committed baseline was measured on a developer machine (Apple M4). Absolute numbers differ on shared CI
    # runners, so this job is informational; run the script locally (or on a dedicated runner with its own
    # baseline) to use it as a hard gate.
    name: Performance report (informational)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: JMH against the committed baseline
        run: bajoterra-bench/scripts/run-benchmarks.sh

  unity-client:
    # The engine-free half of the Unity client (network, prediction, interpolation, HUD model) is built with the
    # language level and API surface of Unity 6 and tested against the real Java server. The visual layer is
    # compile-checked against the UnityEngine reference assemblies; running it needs the Unity editor.
    name: Unity client (tests against the real server, compile check)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Client tests, integration tests and compile check
        run: unity/scripts/verify.sh
